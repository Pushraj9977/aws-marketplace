<!doctype html>
<html lang="en">
<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
    integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
  <title>Registration page</title>
</head>
<body class="text-center" data-api-base-url="https://penuu7szkh.execute-api.eu-central-1.amazonaws.com/Prod">
  <div class="container">
    <div id="alert"></div>
    <div id="status" class="small text-muted mb-3"></div>
    <form class="form-signin" method="POST" enctype="multipart/form-data">
      <img class="mb-4" src="logo.png" alt="" width="72" height="72">
      <h1 class="h3 mb-3 font-weight-normal">Complete your AWS Marketplace onboarding</h1>
      <p class="text-muted small">We will verify your subscription, collect your tenant details, and start provisioning your environment.</p>
      <label for="company_name" class="sr-only">Company name</label>
      <input type="text" name="company_name" class="form-control" placeholder="Company name" required autofocus>
      <label for="contact_email" class="sr-only">Admin email</label>
      <input type="email" name="contact_email" class="form-control" placeholder="Admin email" required>
      <label for="contact_person" class="sr-only">Contact person</label>
      <input type="text" name="contact_person" class="form-control" placeholder="Contact person (optional)">
      <label for="contact_phone" class="sr-only">Contact phone</label>
      <input type="tel" name="contact_phone" class="form-control" placeholder="Contact phone (optional)">
      <button class="btn btn-lg btn-primary btn-block" type="submit">Register</button>
      <p class="mt-5 mb-3 text-muted">&copy; 2024</p>
    </form>
  </div>
  <!-- Optional JavaScript -->
  <!-- jQuery first, then Popper.js, then Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"
    integrity="sha384-NXgwF8Kv9SSAr+jemKKcbvQsz+teULH/a5UNJvZc6kP47hZgl62M1vGnw6gHQhb1"
    crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
    integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
    crossorigin="anonymous"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
    integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
    crossorigin="anonymous"></script>
  <script src="script.js"></script>
</body>
</html>
