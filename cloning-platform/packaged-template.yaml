AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AWS Environment Cloning Platform
Parameters:
  SubscriberTableStreamArn:
    Type: String
    Description: ARN of the DynamoDB Stream for the MarketplaceSubscribers table
Globals:
  Function:
    Runtime: python3.12
    Timeout: 900
    MemorySize: 1024
    Environment:
      Variables:
        LOG_LEVEL: INFO
        SUBSCRIBERS_TABLE: MarketplaceSubscribers
        STATE_TABLE:
          Ref: EnvironmentStateTable
  Api:
    Cors:
      AllowMethods: "'OPTIONS,POST'"
      AllowHeaders: "'Content-Type'"
      AllowOrigin: "'*'"
Resources:
  EnvironmentStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: environment_id
        AttributeType: S
      KeySchema:
      - AttributeName: environment_id
        KeyType: HASH
  CloningStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD
      Definition:
        StartAt: ProvisionDynamoDB
        States:
          ProvisionDynamoDB:
            Type: Task
            Resource:
              Fn::GetAtt:
              - PipelineWorkerFunction
              - Arn
            Parameters:
              step: PROVISION_DYNAMODB
              environment.$: $.environment
            Next: ProvisionSeed
          ProvisionSeed:
            Type: Task
            Resource:
              Fn::GetAtt:
              - PipelineWorkerFunction
              - Arn
            Parameters:
              step: PROVISION_SEED
              environment.$: $.environment
            Next: ProvisionSecrets
          ProvisionSecrets:
            Type: Task
            Resource:
              Fn::GetAtt:
              - PipelineWorkerFunction
              - Arn
            Parameters:
              step: PROVISION_SECRETS
              environment.$: $.environment
            Next: ProvisionCognito
          ProvisionCognito:
            Type: Task
            Resource:
              Fn::GetAtt:
              - PipelineWorkerFunction
              - Arn
            Parameters:
              step: PROVISION_COGNITO
              environment.$: $.environment
            Next: ProvisionAppSync
          ProvisionAppSync:
            Type: Task
            Resource:
              Fn::GetAtt:
              - PipelineWorkerFunction
              - Arn
            Parameters:
              step: PROVISION_APPSYNC
              environment.$: $.environment
            Next: ProvisionLambdas
          ProvisionLambdas:
            Type: Task
            Resource:
              Fn::GetAtt:
              - PipelineWorkerFunction
              - Arn
            Parameters:
              step: PROVISION_LAMBDA
              environment.$: $.environment
            Next: ProvisionApiGateway
          ProvisionApiGateway:
            Type: Task
            Resource:
              Fn::GetAtt:
              - PipelineWorkerFunction
              - Arn
            Parameters:
              step: PROVISION_API_GATEWAY
              environment.$: $.environment
            Next: ProvisionAssessFrontend
          ProvisionAssessFrontend:
            Type: Task
            Resource:
              Fn::GetAtt:
              - PipelineWorkerFunction
              - Arn
            Parameters:
              step: PROVISION_S3_FRONTEND
              environment.$: $.environment
            Next: ProvisionAmplify
          ProvisionAmplify:
            Type: Task
            Resource:
              Fn::GetAtt:
              - PipelineWorkerFunction
              - Arn
            Parameters:
              step: PROVISION_AMPLIFY
              environment.$: $.environment
            Next: HealthCheck
          HealthCheck:
            Type: Task
            Resource:
              Fn::GetAtt:
              - HealthCheckFunction
              - Arn
            Next: GenerateReport
          GenerateReport:
            Type: Task
            Resource:
              Fn::GetAtt:
              - ReportGeneratorFunction
              - Arn
            End: true
      Policies:
      - LambdaInvokePolicy:
          FunctionName:
            Ref: PipelineWorkerFunction
      - LambdaInvokePolicy:
          FunctionName:
            Ref: HealthCheckFunction
      - LambdaInvokePolicy:
          FunctionName:
            Ref: ReportGeneratorFunction
  PipelineWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: s3://catalyst-assess-base-assets-eu-west-1-215116348101/2819cf2aad92d7ca9cf1d21974dab468
      Handler: src.handlers.pipeline_worker.handler
      Policies:
      - AdministratorAccess
  MarketplaceSubscriberFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: s3://catalyst-assess-base-assets-eu-west-1-215116348101/2819cf2aad92d7ca9cf1d21974dab468
      Handler: src.handlers.marketplace_subscriber.handler
      Environment:
        Variables:
          STATE_MACHINE_ARN:
            Ref: CloningStateMachine
      Policies:
      - DynamoDBCrudPolicy:
          TableName: MarketplaceSubscribers
      - DynamoDBCrudPolicy:
          TableName:
            Ref: EnvironmentStateTable
      - StepFunctionsExecutionPolicy:
          StateMachineName:
            Fn::GetAtt:
            - CloningStateMachine
            - Name
      Events:
        StreamEvent:
          Type: DynamoDB
          Properties:
            Stream:
              Ref: SubscriberTableStreamArn
            StartingPosition: TRIM_HORIZON
            BatchSize: 1
            FilterCriteria:
              Filters:
              - Pattern: '{"eventName": ["INSERT"]}'
  MarketplaceLandingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: s3://catalyst-assess-base-assets-eu-west-1-215116348101/2819cf2aad92d7ca9cf1d21974dab468
      Handler: src.handlers.marketplace_landing.resolve_handler
      Environment:
        Variables:
          SELLER_ROLE_ARN: arn:aws:iam::613205425102:role/215116348101_access
      Policies:
      - Statement:
          Effect: Allow
          Action:
          - aws-marketplace:ResolveCustomer
          Resource: '*'
      - Statement:
          Effect: Allow
          Action:
          - sts:AssumeRole
          Resource: arn:aws:iam::*:role/215116348101_access
      - DynamoDBCrudPolicy:
          TableName: MarketplaceSubscribers
      - DynamoDBCrudPolicy:
          TableName:
            Ref: EnvironmentStateTable
      - StepFunctionsExecutionPolicy:
          StateMachineName:
            Fn::GetAtt:
            - CloningStateMachine
            - Name
      Events:
        ResolveApiEvent:
          Type: Api
          Properties:
            Path: /marketplace/resolve
            Method: post
  MarketplaceLandingRegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: s3://catalyst-assess-base-assets-eu-west-1-215116348101/2819cf2aad92d7ca9cf1d21974dab468
      Handler: src.handlers.marketplace_landing.register_handler
      Environment:
        Variables:
          STATE_MACHINE_ARN:
            Ref: CloningStateMachine
          SELLER_ROLE_ARN: arn:aws:iam::613205425102:role/215116348101_access
      Policies:
      - Statement:
          Effect: Allow
          Action:
          - aws-marketplace:ResolveCustomer
          Resource: '*'
      - Statement:
          Effect: Allow
          Action:
          - sts:AssumeRole
          Resource: arn:aws:iam::*:role/215116348101_access
      - DynamoDBCrudPolicy:
          TableName: MarketplaceSubscribers
      - DynamoDBCrudPolicy:
          TableName:
            Ref: EnvironmentStateTable
      - StepFunctionsExecutionPolicy:
          StateMachineName:
            Fn::GetAtt:
            - CloningStateMachine
            - Name
      Events:
        RegisterMarketplaceApiEvent:
          Type: Api
          Properties:
            Path: /marketplace/register
            Method: post
  HealthCheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: s3://catalyst-assess-base-assets-eu-west-1-215116348101/2819cf2aad92d7ca9cf1d21974dab468
      Handler: src.handlers.health_check.handler
      Policies:
      - AdministratorAccess
  ReportGeneratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: s3://catalyst-assess-base-assets-eu-west-1-215116348101/2819cf2aad92d7ca9cf1d21974dab468
      Handler: src.handlers.report_generator.handler
      Environment:
        Variables:
          SES_SENDER_EMAIL: act1@alliancecaretech.com
      Policies:
      - AdministratorAccess
      - Statement:
          Effect: Allow
          Action:
          - ses:SendEmail
          - ses:SendRawEmail
          Resource: '*'
Outputs:
  StateMachineArn:
    Description: Cloning Step Function ARN
    Value:
      Ref: CloningStateMachine
  MarketplaceResolveEndpoint:
    Description: API Gateway endpoint URL for POST /marketplace/resolve
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/marketplace/resolve/
  MarketplaceRegisterEndpoint:
    Description: API Gateway endpoint URL for POST /marketplace/register
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/marketplace/register/
